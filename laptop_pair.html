<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="https://mindpw.com/favicon.ico" />
<title>Authorize this Laptop — Lajtner Scope</title>
<style>
  :root{--bg:#0d1117;--card:#161b22;--border:#26303c;--text:#e6edf3;--muted:#8b98a5;--green:#00c271;--amber:#ff9500}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg);color:var(--text);padding:1.5rem}
  .card{background:var(--card);border:1px solid var(--border);border-radius:18px;
    padding:2.2rem;max-width:440px;width:100%;text-align:center}
  h1{font-size:1.35rem;margin:.2rem 0 .5rem}
  p{color:var(--muted);font-size:.92rem;line-height:1.6;margin:.5rem 0}
  .qrbox{background:#fff;border-radius:14px;padding:1rem;display:inline-block;margin:1.2rem 0}
  #qr{width:220px;height:220px;display:block}
  .steps{text-align:left;font-size:.88rem;color:var(--text);margin:1rem 0;padding-left:1.2rem}
  .steps li{margin:.4rem 0}
  .status{margin-top:1rem;padding:.7rem 1rem;border-radius:10px;font-size:.9rem;font-weight:600}
  .status.wait{background:rgba(255,149,0,.1);border:1px solid rgba(255,149,0,.35);color:var(--amber)}
  .status.ok{background:rgba(0,194,113,.12);border:1px solid rgba(0,194,113,.45);color:var(--green)}
  .status.exp{background:rgba(255,80,80,.1);border:1px solid rgba(255,80,80,.35);color:#ff5555}
  .btn{margin-top:1rem;background:var(--green);color:#04140c;border:none;border-radius:10px;
    padding:.7rem 1.4rem;font-weight:800;cursor:pointer;font-size:.95rem}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,149,0,.3);
    border-top-color:var(--amber);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:.5rem}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
</head>
<body>
  <div class="card">
    <h1>🔗 Authorize this Laptop</h1>
    <p>Scan the QR code below with your phone to unlock the app on this computer.</p>

    <div class="qrbox"><canvas id="qr"></canvas></div>

    <ol class="steps">
      <li>Open the app on your <strong>phone</strong> and tap your chip.</li>
      <li>Tap <strong>“Authorize laptop”</strong>.</li>
      <li>Scan this QR code — this laptop unlocks automatically.</li>
    </ol>

    <div class="status wait" id="status"><span class="spinner"></span>Waiting for your phone…</div>
    <button class="btn" id="regen" style="display:none" onclick="start()">Generate a new code</button>
  </div>

<script>
  const API = "https://wheelttt.xyz";
  const PAIR_URL_BASE = "https://mindpw.com/kinetic/pair"; // phone opens this with ?pid=
  let pairId = null, poll = null;

  async function start(){
    clearInterval(poll);
    document.getElementById("regen").style.display = "none";
    setStatus("wait", '<span class="spinner"></span>Waiting for your phone…');
    try{
      const r = await fetch(`${API}/pair/new`, { method: "POST" });
      const d = await r.json();
      pairId = d.pair_id;
      const url = `${PAIR_URL_BASE}?pid=${encodeURIComponent(pairId)}`;
      QRCode.toCanvas(document.getElementById("qr"), url, { width: 220, margin: 1 });
      startPolling();
    }catch(e){ setStatus("exp", "Could not reach the server. Refresh to retry."); }
  }

  function startPolling(){
    poll = setInterval(async () => {
      try{
        const r = await fetch(`${API}/pair/status?pid=${encodeURIComponent(pairId)}`);
        const d = await r.json();
        if(d.authorized && d.token){
          clearInterval(poll);
          // store the laptop token so the app treats this browser as authorized
          try{ sessionStorage.setItem("wt_device_auth", JSON.stringify({authorized:true, laptop:true, token:d.token, email:d.email, ts:Date.now()})); }catch{}
          setStatus("ok", "✓ Laptop authorized! Redirecting…");
          setTimeout(()=>{ window.location.href = "https://mindpw.com/kinetic/upload"; }, 1200);
        } else if(d.expired){
          clearInterval(poll);
          setStatus("exp", "This code expired.");
          document.getElementById("regen").style.display = "inline-block";
        }
      }catch(e){/* keep polling */}
    }, 2500);
  }

  function setStatus(cls, html){
    const s = document.getElementById("status");
    s.className = "status " + cls; s.innerHTML = html;
  }

  start();
</script>
</body>
</html>
