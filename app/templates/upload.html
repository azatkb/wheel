<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wheel Tracker &#8212; Upload</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#0d0d0d;color:#e0e0e0;padding:1.5rem;max-width:980px;margin:0 auto}
nav{margin-bottom:1.5rem}
nav a{color:#00ff88;margin-right:1.5rem;font-size:.9rem;text-decoration:none}
nav a:hover{text-decoration:underline}
h1{color:#00ff88;font-size:1.6rem;margin-bottom:.25rem}
.sub{color:#555;font-size:.85rem;margin-bottom:1.8rem}
.card{background:#161616;border:1px solid #252525;border-radius:12px;padding:1.4rem;margin-bottom:1.3rem}
h2{color:#888;font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;margin-bottom:1rem}
label{display:block;color:#888;font-size:.78rem;margin-bottom:.25rem;margin-top:.7rem}
input[type=file]{width:100%;color:#aaa;margin-bottom:.5rem}
input[type=email],select{width:100%;background:#1e1e1e;border:1px solid #2e2e2e;border-radius:6px;padding:.45rem .65rem;color:#ccc;font-size:.88rem}
.row{display:flex;gap:.8rem;flex-wrap:wrap}
.row>div{flex:1;min-width:140px}
button{background:#00ff88;color:#000;border:none;border-radius:8px;padding:.55rem 1.3rem;font-size:.9rem;font-weight:700;cursor:pointer;margin-right:.5rem;margin-top:.8rem}
button:hover{background:#00d977}
button.sec{background:#252525;color:#aaa}
button.sec:hover{background:#2e2e2e}
pre#log{font-family:monospace;font-size:.77rem;background:#0a0a0a;border-radius:8px;padding:.8rem;min-height:60px;border:1px solid #1e1e1e;white-space:pre-wrap;max-height:200px;overflow-y:auto;line-height:1.7}
.prog-wrap{background:#1e1e1e;border-radius:5px;height:7px;margin:.5rem 0 .8rem}
.prog-fill{height:7px;border-radius:5px;background:#00ff88;width:0%;transition:width .4s}
.metrics{display:flex;flex-wrap:wrap;gap:.6rem;margin-bottom:1rem}
.met{background:#0f0f0f;border:1px solid #222;border-radius:8px;padding:.65rem 1rem;text-align:center;min-width:110px;flex:1}
.met .v{font-size:1.7rem;font-weight:700;color:#00ff88;display:block;font-variant-numeric:tabular-nums}
.met .l{font-size:.7rem;color:#555;margin-top:.15rem}
canvas#chart{display:block;border-radius:8px;background:#0a0a0a;width:100%;height:200px}
.acts{margin:.8rem 0}
.acts a{text-decoration:none}
.tbl-wrap{max-height:260px;overflow-y:auto;margin-top:.8rem}
table{width:100%;border-collapse:collapse;font-size:.78rem}
th{color:#555;text-align:left;padding:.3rem .55rem;border-bottom:1px solid #1e1e1e;position:sticky;top:0;background:#161616}
td{padding:.28rem .55rem;border-bottom:1px solid #181818}
tr:hover td{background:#1a1a1a}
.tag{display:inline-block;padding:.1rem .4rem;border-radius:4px;font-size:.7rem;font-weight:700}
.ty{background:#332;color:#ff0}.tr{background:#322;color:#f44}.tn{background:#1e1e1e;color:#555}
.cb{display:inline-block;height:6px;border-radius:3px;vertical-align:middle;background:linear-gradient(90deg,#f44,#ff0,#0f0)}
</style>
</head>
<body>
<nav>
  <a href="/">Upload</a>
  <a href="/stream-test">Live stream</a>
  <a href="/docs" target="_blank">API docs</a>
</nav>
<h1>Wheel Tracker</h1>
<p class="sub">Upload a video &#8212; detect wheel rotation using colored markers</p>

<div class="card">
  <h2>Video + parameters</h2>
  <input type="file" id="fi" accept="video/*">

  <div class="row">
    <div>
      <label>User email</label>
      <input type="email" id="email" placeholder="user@example.com">
    </div>
    <div>
      <label>Direction</label>
      <select id="dir">
        <option value="auto">Auto-detect</option>
        <option value="cw">Clockwise</option>
        <option value="ccw">Counter-clockwise</option>
        <option value="cw+ccw">CW then CCW</option>
        <option value="ccw+cw">CCW then CW</option>
      </select>
    </div>
    <div>
      <label>Medium</label>
      <select id="med">
        <option value="air">Air</option>
        <option value="water">Water</option>
      </select>
    </div>
    <div>
      <label>Hand visible</label>
      <select id="hand">
        <option value="false">No hand</option>
        <option value="true">Hand visible</option>
      </select>
    </div>
    <div>
      <label>Info level</label>
      <select id="info">
        <option value="basic">Basic (time + deg)</option>
        <option value="full">Full (+ rad + velocity)</option>
      </select>
    </div>
  </div>

  <button onclick="go()" id="btn">Upload &amp; Process</button>
  <button class="sec" onclick="reset()">Clear</button>
</div>

<div class="card">
  <h2>Status</h2>
  <pre id="log">Waiting...</pre>
  <div class="prog-wrap"><div class="prog-fill" id="prog"></div></div>
</div>

<div class="card" id="res" style="display:none">
  <h2>Results</h2>
  <div class="metrics" id="mets"></div>
  <canvas id="chart"></canvas>
  <div class="acts" id="acts"></div>
  <div class="tbl-wrap">
    <table>
      <thead><tr>
        <th>Time (s)</th><th>Angle (&deg;)</th><th>Angle (rad)</th>
        <th>Total (&deg;)</th><th>Vel (&deg;/s)</th>
        <th>Sig %</th><th>Bar</th><th>Src</th>
      </tr></thead>
      <tbody id="tb"></tbody>
    </table>
  </div>
</div>

<script>
let jid=null,timer=null;
const P={queued:20,preprocessing:45,processing:75,done:100};

function addLog(m){const e=document.getElementById('log');e.textContent+=m+'\n';e.scrollTop=e.scrollHeight}
function setProg(p){document.getElementById('prog').style.width=p+'%'}
function reset(){if(timer)clearInterval(timer);timer=jid=null;document.getElementById('log').textContent='';document.getElementById('res').style.display='none';setProg(0)}

async function go(){
  const f=document.getElementById('fi');
  if(!f.files.length){alert('Select a video first');return}
  reset();
  const fd=new FormData();
  fd.append('file',f.files[0]);
  fd.append('user_email',document.getElementById('email').value);
  fd.append('direction',document.getElementById('dir').value);
  fd.append('medium',document.getElementById('med').value);
  fd.append('hand_visible',document.getElementById('hand').value);
  fd.append('info_level',document.getElementById('info').value);
  document.getElementById('btn').disabled=true;
  addLog('Uploading '+f.files[0].name+' ...');
  setProg(10);
  try{
    const r=await fetch('/upload',{method:'POST',body:fd});
    const d=await r.json();
    if(!r.ok)throw new Error(d.detail||r.statusText);
    jid=d.job_id;
    addLog('Job: '+jid);
    if(d.video_info){const vi=d.video_info;addLog('Video: '+vi.width+'x'+vi.height+' @ '+vi.fps+'fps  '+vi.duration+'s')}
    timer=setInterval(poll,2000);
  }catch(e){addLog('ERROR: '+e.message);document.getElementById('btn').disabled=false}
}

async function poll(){
  if(!jid)return;
  const d=await(await fetch('/status/'+jid)).json();
  addLog('Status: '+d.status+(d.sample_count?' ('+d.sample_count+' samples)':''));
  setProg(P[d.status]||30);
  if(d.status==='done'){clearInterval(timer);document.getElementById('btn').disabled=false;showResults(jid,d)}
  else if(d.status==='error'){clearInterval(timer);addLog('ERROR: '+(d.detail||'?'));document.getElementById('btn').disabled=false}
}

async function showResults(jid,info){
  const samples=await(await fetch('/results/'+jid)).json();
  addLog('Loaded '+samples.length+' samples');
  document.getElementById('res').style.display='block';
  if(samples.length){
    const last=samples[samples.length-1];
    const maxC=Math.max(...samples.map(s=>Math.abs(+s.cumulative_deg)));
    const avgS=Math.round(samples.reduce((a,s)=>a+(+s.confidence_pct),0)/samples.length);
    document.getElementById('mets').innerHTML=`
      <div class="met"><span class="v">${samples.length}</span><span class="l">Samples</span></div>
      <div class="met"><span class="v">${(+last.timestamp_sec).toFixed(1)}s</span><span class="l">Duration</span></div>
      <div class="met"><span class="v">${maxC.toFixed(1)}&deg;</span><span class="l">Max rotation</span></div>
      <div class="met"><span class="v">${(+last.cumulative_deg).toFixed(1)}&deg;</span><span class="l">Final angle</span></div>
      <div class="met"><span class="v">${avgS}%</span><span class="l">Avg significance</span></div>`;
  }
  document.getElementById('acts').innerHTML=`
    <a href="/download/${jid}"><button>Download video</button></a>
    <a href="/csv/${jid}"><button class="sec">Download CSV</button></a>`;
  drawChart(samples);
  const tb=document.getElementById('tb');tb.innerHTML='';
  samples.forEach(s=>{
    const bw=Math.round((+s.confidence_pct)*55/100);
    const tag=s.source==='YELLOW'?'<span class="tag ty">YEL</span>':s.source==='RED'?'<span class="tag tr">RED</span>':'<span class="tag tn">-</span>';
    tb.innerHTML+=`<tr>
      <td>${(+s.timestamp_sec).toFixed(2)}</td>
      <td>${s.rotation_deg!=null?(+s.rotation_deg).toFixed(1):'--'}</td>
      <td>${s.rotation_rad!=null?(+s.rotation_rad).toFixed(4):'--'}</td>
      <td>${(+s.cumulative_deg).toFixed(1)}</td>
      <td>${s.angular_vel_dps!=null?(+s.angular_vel_dps).toFixed(1):'--'}</td>
      <td>${s.confidence_pct}</td>
      <td><span class="cb" style="width:${bw}px"></span></td>
      <td>${tag}</td></tr>`;
  });
}

function drawChart(s){
  const c=document.getElementById('chart');
  c.width=c.offsetWidth||800;c.height=200;
  const ctx=c.getContext('2d'),W=c.width,H=c.height;
  ctx.fillStyle='#0a0a0a';ctx.fillRect(0,0,W,H);
  if(s.length<2)return;
  const pad={l:48,r:12,t:14,b:24},cW=W-pad.l-pad.r,cH=H-pad.t-pad.b;
  const ts=s.map(x=>+x.timestamp_sec),cs=s.map(x=>+x.cumulative_deg),qs=s.map(x=>+x.confidence_pct);
  const tMin=Math.min(...ts),tMax=Math.max(...ts)||1,vMin=Math.min(...cs,0),vMax=Math.max(...cs,1),vR=vMax-vMin||1;
  const tx=t=>pad.l+(t-tMin)/(tMax-tMin)*cW,ty=v=>pad.t+(1-(v-vMin)/vR)*cH;
  ctx.strokeStyle='#1a1a1a';ctx.lineWidth=1;
  [0,.25,.5,.75,1].forEach(f=>{const y=pad.t+f*cH,v=vMax-f*vR;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();ctx.fillStyle='#444';ctx.font='9px system-ui';ctx.fillText(v.toFixed(0)+'°',2,y+3)});
  // Confidence shading
  ctx.fillStyle='rgba(0,255,136,0.05)';ctx.beginPath();ctx.moveTo(tx(ts[0]),pad.t+cH);
  s.forEach((x,i)=>ctx.lineTo(tx(ts[i]),pad.t+(1-qs[i]/100)*cH));
  ctx.lineTo(tx(ts[ts.length-1]),pad.t+cH);ctx.closePath();ctx.fill();
  // Line
  ctx.strokeStyle='#00ff88';ctx.lineWidth=2;ctx.beginPath();
  s.forEach((x,i)=>{i===0?ctx.moveTo(tx(ts[i]),ty(cs[i])):ctx.lineTo(tx(ts[i]),ty(cs[i]))});
  ctx.stroke();
  // Dots
  s.forEach((x,i)=>{ctx.fillStyle=qs[i]===100?'#00ff88':qs[i]>=70?'#ff0':'#f44';ctx.beginPath();ctx.arc(tx(ts[i]),ty(cs[i]),2.2,0,Math.PI*2);ctx.fill()});
  ctx.fillStyle='#00ff88';ctx.font='10px system-ui';ctx.fillText('cumulative rotation (deg)',pad.l+4,pad.t+12);
  ctx.fillStyle='#444';ctx.fillText('time (s)',W/2-20,H-4);
}
</script>
</body>
</html>
