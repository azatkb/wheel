<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wheel Tracker &#8212; Live Stream</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; background: #0f0f0f; color: #e0e0e0;
       min-height: 100vh; padding: 2rem 1.5rem; max-width: 960px; margin: 0 auto; }
nav { margin-bottom: 1.5rem; }
nav a { color: #00ffb4; margin-right: 1.5rem; font-size: 0.9rem; text-decoration: none; }
nav a:hover { text-decoration: underline; }
h1 { color: #00ffb4; font-size: 1.7rem; margin-bottom: 0.3rem; }
.subtitle { color: #555; margin-bottom: 2rem; font-size: 0.9rem; }

/* ── Layout: two columns on wide screens ─────────────────────────── */
.row { display: flex; gap: 1.5rem; flex-wrap: wrap; }
.col  { flex: 1; min-width: 280px; }

.card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px;
        padding: 1.5rem; margin-bottom: 1.5rem; }
h2 { color: #aaa; font-size: 0.85rem; text-transform: uppercase;
     letter-spacing: .06em; margin-bottom: 1rem; }

/* ── Camera feed ─────────────────────────────────────────────────── */
video { width: 100%; border-radius: 8px; background: #000; display: block;
        max-height: 260px; object-fit: cover; }

/* ── Controls ────────────────────────────────────────────────────── */
.ctrl-row { display: flex; align-items: center; gap: .8rem; flex-wrap: wrap;
            margin-top: 1rem; }
select, input[type=number] { background: #222; color: #ccc;
  border: 1px solid #333; border-radius: 6px; padding: .4rem .6rem; }
label.lbl { color: #666; font-size: .82rem; }
button { background: #00ffb4; color: #000; border: none; border-radius: 8px;
         padding: .55rem 1.3rem; font-size: .9rem; font-weight: 700; cursor: pointer; }
button:hover { background: #00d99a; }
button:disabled { background: #2a2a2a; color: #555; cursor: not-allowed; }
button.stop { background: #e33; color: #fff; }
button.stop:hover { background: #c22; }

/* ── Big metrics ─────────────────────────────────────────────────── */
.big { font-size: 2.8rem; font-weight: 700; font-variant-numeric: tabular-nums;
       line-height: 1; }
.big-green  { color: #00ffb4; }
.big-white  { color: #e0e0e0; }
.metric-row { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.2rem; }
.metric     { flex: 1; min-width: 110px; }
.lbl-sm     { color: #555; font-size: .72rem; margin-bottom: .25rem; }

/* ── Confidence bar ──────────────────────────────────────────────── */
.conf-track { background: #222; border-radius: 6px; height: 10px; margin-top: .3rem; }
.conf-fill  { height: 10px; border-radius: 6px; transition: width .2s;
              background: linear-gradient(90deg,#f44 0%,#ff0 50%,#0f0 100%); }

/* ── Dial canvas ─────────────────────────────────────────────────── */
canvas#dial { display: block; border-radius: 8px; }

/* ── Mini chart ──────────────────────────────────────────────────── */
canvas#minichart { display: block; border-radius: 8px; background: #111;
                   width: 100%; height: 130px; }

/* ── Log ─────────────────────────────────────────────────────────── */
#log { font-family: monospace; font-size: .77rem; background: #111;
       border-radius: 8px; padding: .8rem; height: 110px; overflow-y: auto;
       border: 1px solid #1e1e1e; line-height: 1.6; }
</style>
</head>
<body>

<nav>
  <a href="/upload.html">Upload</a>
  <a href="/stream.html">Live stream</a>
  
</nav>

<h1>Wheel Tracker &#8212; Live Stream</h1>
<p class="subtitle">Connect a camera, push frames via WebSocket, see rotation in real-time</p>

<div class="row">
  <!-- Left column: camera + controls -->
  <div class="col">
    <div class="card">
      <h2>Camera</h2>
      <video id="cam" autoplay muted playsinline></video>
      <div class="ctrl-row">
        <div>
          <div class="lbl-sm">Camera</div>
          <select id="cam-select" onchange="changeCamera()"></select>
        </div>
        <div>
          <div class="lbl-sm">FPS</div>
          <input type="number" id="fps-input" value="15" min="1" max="30" style="width:60px">
        </div>
      </div>
      <div class="ctrl-row">
        <button id="btn-start" onclick="startStream()">Start stream</button>
        <button id="btn-stop" class="stop" onclick="stopStream()" disabled>Stop</button>
        <button onclick="resetZero()" class="sec" style="background:#2a2a2a;color:#ccc">Reset 0°</button>
      </div>
    </div>

    <!-- Log -->
    <div class="card">
      <h2>Log</h2>
      <div id="log"></div>
    </div>
  </div>

  <!-- Right column: readouts + dial -->
  <div class="col">
    <div class="card">
      <h2>Real-time rotation</h2>

      <div class="metric-row">
        <div class="metric">
          <div class="lbl-sm">Current angle</div>
          <div class="big big-green" id="val-angle">—</div>
        </div>
        <div class="metric">
          <div class="lbl-sm">Total rotation</div>
          <div class="big big-white" id="val-cum">+0.0°</div>
        </div>
      </div>

      <div class="metric-row">
        <div class="metric">
          <div class="lbl-sm">Confidence</div>
          <div id="val-conf" style="font-size:1.1rem;font-weight:700">—</div>
          <div class="conf-track"><div class="conf-fill" id="conf-fill" style="width:0%"></div></div>
        </div>
        <div class="metric">
          <div class="lbl-sm">Source</div>
          <div id="val-src" style="font-size:1.1rem;font-weight:700;color:#ff0">—</div>
        </div>
        <div class="metric">
          <div class="lbl-sm">Frame</div>
          <div id="val-frame" style="font-size:.9rem;color:#666">—</div>
        </div>
      </div>

      <!-- Rotation dial -->
      <canvas id="dial" width="150" height="150"></canvas>
    </div>

    <!-- Mini live chart -->
    <div class="card">
      <h2>Cumulative rotation (live)</h2>
      <canvas id="minichart"></canvas>
    </div>
  </div>
</div>

<script>
/* ── State ──────────────────────────────────────────────────────────── */
let ws       = null;
let camStream = null;
let sendLoop = null;
const HISTORY = 120;         // number of points to show on mini chart
let chartData = [];          // {t, cum, conf}

/* ── Camera enumerate ───────────────────────────────────────────────── */
async function listCameras() {
  try {
    // Request permission first so labels are visible
    await navigator.mediaDevices.getUserMedia({ video: true });
    const devs = await navigator.mediaDevices.enumerateDevices();
    const sel  = document.getElementById('cam-select');
    sel.innerHTML = '';
    devs.filter(d => d.kind === 'videoinput').forEach((d, i) => {
      const opt = document.createElement('option');
      opt.value = d.deviceId;
      opt.text  = d.label || 'Camera ' + (i+1);
      sel.appendChild(opt);
    });
  } catch (e) {
    addLog('Camera permission denied');
  }
}
listCameras();

async function changeCamera() {
  if (camStream) {
    camStream.getTracks().forEach(t => t.stop());
    const sel = document.getElementById('cam-select');
    camStream = await navigator.mediaDevices.getUserMedia({
      video: { deviceId: sel.value }
    });
    document.getElementById('cam').srcObject = camStream;
  }
}

/* ── Log helper ─────────────────────────────────────────────────────── */
function addLog(msg) {
  const el = document.getElementById('log');
  const ts = new Date().toLocaleTimeString();
  el.innerHTML += `<div>${ts} — ${msg}</div>`;
  el.scrollTop  = el.scrollHeight;
}

/* ── Dial drawing ───────────────────────────────────────────────────── */
function drawDial(angleDeg, conf) {
  const c   = document.getElementById('dial');
  const ctx = c.getContext('2d');
  const cx = 75, cy = 75, r = 62;

  ctx.clearRect(0, 0, 150, 150);

  /* Outer track */
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.fillStyle = '#111'; ctx.fill();
  ctx.strokeStyle = '#2a2a2a'; ctx.lineWidth = 2; ctx.stroke();

  /* Confidence arc (background) */
  if (conf != null) {
    const arcEnd = -Math.PI/2 + (conf/100) * Math.PI*2;
    ctx.beginPath();
    ctx.arc(cx, cy, r-5, -Math.PI/2, arcEnd);
    ctx.strokeStyle = conf >= 80 ? '#00ffb4' : conf >= 50 ? '#ff0' : '#f44';
    ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.stroke();
  }

  /* Tick at 12 o'clock */
  ctx.strokeStyle = '#444'; ctx.lineWidth = 2; ctx.lineCap = 'butt';
  ctx.beginPath(); ctx.moveTo(cx, cy-r+8); ctx.lineTo(cx, cy-r+16); ctx.stroke();

  /* Needle */
  if (angleDeg != null) {
    const rad = (angleDeg - 90) * Math.PI / 180;
    ctx.strokeStyle = '#00ffb4'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx - 8*Math.cos(rad), cy - 8*Math.sin(rad));
    ctx.lineTo(cx + (r-18)*Math.cos(rad), cy + (r-18)*Math.sin(rad));
    ctx.stroke();
  }

  /* Center dot */
  ctx.fillStyle = '#00ffb4';
  ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI*2); ctx.fill();
}
drawDial(null, null);

/* ── Mini chart ─────────────────────────────────────────────────────── */
function drawMiniChart() {
  const canvas = document.getElementById('minichart');
  canvas.width  = canvas.offsetWidth  || 400;
  canvas.height = canvas.offsetHeight || 130;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  ctx.fillStyle = '#111'; ctx.fillRect(0, 0, W, H);
  if (chartData.length < 2) return;

  const pad = { l:40, r:8, t:10, b:18 };
  const cW  = W - pad.l - pad.r;
  const cH  = H - pad.t - pad.b;
  const cums = chartData.map(d => d.cum);
  const vMin = Math.min(...cums, 0), vMax = Math.max(...cums, 1);
  const vR   = vMax - vMin || 1;

  /* Grid */
  ctx.strokeStyle = '#1e1e1e'; ctx.lineWidth = 1;
  [0, .5, 1].forEach(f => {
    const y = pad.t + f * cH;
    const v = vMax - f * vR;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(W-pad.r, y); ctx.stroke();
    ctx.fillStyle = '#444'; ctx.font = '9px system-ui';
    ctx.fillText(v.toFixed(0)+'°', 2, y+3);
  });

  /* Line */
  ctx.strokeStyle = '#00ffb4'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  chartData.forEach((d, i) => {
    const x = pad.l + i/(chartData.length-1)*cW;
    const y = pad.t + (1-(d.cum-vMin)/vR)*cH;
    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  });
  ctx.stroke();
}

/* ── WebSocket stream ───────────────────────────────────────────────── */
async function startStream() {
  const sel = document.getElementById('cam-select');
  const fps = +document.getElementById('fps-input').value || 15;

  try {
    camStream = await navigator.mediaDevices.getUserMedia({
      video: { deviceId: sel.value || undefined, width: 640, height: 480 }
    });
    document.getElementById('cam').srcObject = camStream;

    const API_WS = 'wss://schema-zone-completely-bundle.trycloudflare.com';
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`wss://schema-zone-completely-bundle.trycloudflare.com/stream`);
    ws.onopen  = () => addLog('WebSocket connected');
    ws.onclose = () => addLog('WebSocket closed');
    ws.onerror = () => addLog('WebSocket error');

    ws.onmessage = (event) => {
      const d = JSON.parse(event.data);
      if (d.error) { addLog('Server: ' + d.error); return; }
      updateDisplay(d);
    };

    /* Send frames at requested fps */
    const canvas = document.createElement('canvas');
    const video  = document.getElementById('cam');
    sendLoop = setInterval(() => {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      canvas.width  = video.videoWidth  || 640;
      canvas.height = video.videoHeight || 480;
      canvas.getContext('2d').drawImage(video, 0, 0);
      canvas.toBlob(blob => blob.arrayBuffer().then(b => ws.send(b)),
                    'image/jpeg', 0.82);
    }, 1000 / fps);

    document.getElementById('btn-start').disabled = true;
    document.getElementById('btn-stop').disabled  = false;
    addLog(`Streaming at ${fps} fps`);

  } catch (e) {
    addLog('Error: ' + e.message);
  }
}

function stopStream() {
  if (sendLoop)   clearInterval(sendLoop);
  if (ws)         ws.close();
  if (camStream)  camStream.getTracks().forEach(t => t.stop());
  ws = camStream = sendLoop = null;
  document.getElementById('btn-start').disabled = false;
  document.getElementById('btn-stop').disabled  = true;
  addLog('Stream stopped');
}

function resetZero() {
  /* Tell server to reset zero by disconnecting + reconnecting
     The server resets zero_offset = None on each new connection */
  if (ws && ws.readyState === WebSocket.OPEN) {
    stopStream();
    setTimeout(startStream, 300);
    addLog('Zero reset &#8212; reconnecting...');
  }
}

/* ── Update display from WS message ─────────────────────────────────── */
function updateDisplay(d) {
  const angle = d.rotation_deg;
  const cum   = d.cumulative_deg;
  const conf  = d.confidence_pct;

  document.getElementById('val-angle').textContent =
    angle != null ? angle.toFixed(1) + '°' : '—';
  document.getElementById('val-cum').textContent =
    (cum >= 0 ? '+' : '') + cum.toFixed(1) + '°';
  document.getElementById('val-conf').textContent = conf + '%';
  document.getElementById('conf-fill').style.width = conf + '%';
  document.getElementById('val-src').textContent   = d.source || '—';
  document.getElementById('val-frame').textContent  =
    '#' + d.frame + (d.scale_mm_px ? '  ' + d.scale_mm_px.toFixed(4) + ' mm/px' : '');

  drawDial(angle, conf);

  /* Mini chart history */
  chartData.push({ cum: cum, conf: conf });
  if (chartData.length > HISTORY) chartData.shift();
  drawMiniChart();
}
</script>
</body>
</html>
